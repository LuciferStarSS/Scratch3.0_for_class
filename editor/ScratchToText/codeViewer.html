<script>
var bChanged=false;
function autoSave()
{
   bChanged=true;


}

function setEditor(id)
{
   parent.showCE();
   switch(id){
   case 1:
          parent.currentEditor=editor1;
          parent.editor.setValue(editor1.getValue());
          break;

   case 2:
          parent.currentEditor=editor2;
          parent.editor.setValue(editor2.getValue());
          break;

   case 3:
          parent.currentEditor=editor3;
          parent.editor.setValue(editor3.getValue());

          break;

   case 4:
          parent.currentEditor=editor4;
          parent.editor.setValue(editor4.getValue());

          break;
   }
   parent.editor.clearSelection();

    parent.editor.addEventListener("input", function () {
        showTips(parent.editor,true);
    });
}

var nVarID=0;
function addVariable(id,n)
{
   switch(id)
   {
      case 1:
         switch(n)
         {
            case 1:
               editor1.setValue(editor1.getValue()+"\nVAR 变量名"+(++nVarID)+"=0;");
            break;

            case 2:
               editor1.setValue(editor1.getValue()+"\nLIST 列表名"+(++nVarID)+"={};");
            break;

            case 3:
               editor1.setValue(editor1.getValue()+"\nMSG 消息"+(++nVarID)+"=\"消息"+(nVarID)+"\";");
            break;
         }
         editor1.clearSelection();

         break;
      case 2:
         switch(n)
         {
            case 1:
               editor2.setValue(editor2.getValue()+"\nVAR 变量名"+(++nVarID)+"=0;");
            break;

            case 2:
               editor2.setValue(editor2.getValue()+"\nLIST 列表名"+(++nVarID)+"={};");
            break;
         }
         editor2.clearSelection();
         break;
   }
}

var nFunctionID=0;
function addFunction(n)
{
   if(nFunctionID==0)
      editor3.setValue(editor3.getValue()+"\n/************************************\n说明：\n1.自制积木无返回值，所以函数返回值类型为void；\n2.普通参数类型为VAR；\n3.布尔值参数类型为BOOL；\n4.因为参数要显示在积木上，所以在函数名中用“_参数名_”来实现定位。\n\n自制积木可设置“运行时不刷新屏幕”，将函数列表中的参数“false”改为“true”即可。\n“false”参数可省略。\n以下两种定义效果相同：\nvoid Func(false){\n};\nvoid Func(){\n};\n************************************/\n");

   switch(n)
   {
      case 1:
         editor3.setValue(editor3.getValue()+"void func"+(++nFunctionID)+"(false){\n//在这里添加代码\n}\n");
      break;

      case 2:
         editor3.setValue(editor3.getValue()+"void func_a"+(++nFunctionID)+"_(VAR a"+nFunctionID+",false){\n//在这里添加代码\n}\n");
      break;

      case 3:
         editor3.setValue(editor3.getValue()+"void func_b"+(++nFunctionID)+"_(BOOL b"+nFunctionID+",false){\n//在这里添加代码\n}\n");
      break;

      case 4:
         editor3.setValue(editor3.getValue()+"void func_a"+(++nFunctionID)+"__b"+(nFunctionID)+"_(VAR a"+nFunctionID+",BOOL b"+nFunctionID+",false){\n//在这里添加代码\n}\n");
      break;
   }
   editor3.clearSelection();
}

function setSize(id,n)
{
   var editor=document.getElementById("text-code-ace"+id);

   if(editor.style.fontSize=='') 
      editor.style.fontSize="14px";

   if(parseInt(editor.style.fontSize)<12)
   {
      editor.style.fontSize="12px";
   }
}

// 将光标位置转换为像素坐标
function getCursorPixelPosition(editor,row, column) {
    // 如果未提供参数，使用当前光标位置
    if (row === undefined || column === undefined) {
        var cursor = editor.getCursorPosition();
        row = cursor.row;
        column = cursor.column;
    }
    
    // 获取像素位置
    var pixelPos = editor.renderer.textToScreenCoordinates(row, column);
    
    return {
        x: pixelPos.pageX,
        y: pixelPos.pageY,
        clientX: pixelPos.clientX,
        clientY: pixelPos.clientY
    };
}


// 如果有选中文本则替换，否则在光标处插入
function insertOrReplace(editor,text) {
    // 获取选择范围
    var range = editor.getSelectionRange();
    
    if (range.isEmpty()) {
        // 没有选中文本，在光标处插入
        editor.insert(text);
    } else {
        // 有选中文本，替换选中内容
        editor.session.replace(range, text);
    }
}

// 选中光标前的 n 个字符
function selectBeforeCursor(editor,n) {
    var cursor = editor.getCursorPosition();
    var startColumn = Math.max(0, cursor.column - n);
    
    // 设置选择范围
    editor.selection.setSelectionRange({
        start: {
            row: cursor.row,
            column: startColumn
        },
        end: {
            row: cursor.row,
            column: cursor.column
        }
    });
}

function showTips(editor,bParent=false)
{
   if(bParent)
   {
      divIV=parent.document.getElementById("intel_view");
      divPROMPT=parent.document.getElementById("intel");
   }
   else
   {
      divIV=document.getElementById("intel_view");
      divPROMPT=document.getElementById("intel");
   }

   var cursorPos = editor.getCursorPosition();

   // 获取当前行内容
   var currentLine = editor.session.getLine(cursorPos.row);

   // 获取当前行中光标位置前的文本
   var strLast = currentLine.substring(0, cursorPos.column);

   //alert( textBeforeCursorInLine);

   var arrLineData=strLast.split(/[ .,!?;:(){}0123456789]/);//strLast.match(/\b[a-zA-Z]+\b/g) || [];

   var strKeyword=arrLineData.pop();

   //if(id.id!="CODE_HATS" && id.id!="CODE_FREE") return;		//只能在代码窗口显示提示
   var bFound=false;

   if(strKeyword && !bInserted)//可以响应空格
   {
      var strKeywordType='';
      for(var i=0;i<arrKEYWORD.length;i++)
      {
         //strLast=strLast.trim(' ');			//过滤空格
         var nPos=arrKEYWORD[i].indexOf(strKeyword);	//匹配关键词所对应的命令
         if(strKeyword=='') {nPos=1;}			//如果敲了空格，就显示所有命令。
         if(nPos!=-1)					//匹配到，就显示
         {
            if(!bFound)
               divPROMPT.innerHTML=""; 

            var d=document.createElement("div");
            d.style="position: relative;width: 150px;margin:4px;cursor:default";
            d.innerText=arrKEYWORD[i].split('|')[0];
            d.setAttribute("d",arrKEYWORD[i].split('|')[1]);
            d.onclick=function(){
               divPROMPT.style.visibility="hidden";
               selectBeforeCursor(editor,strKeyword.length);		//选中要替换的文本
               insertOrReplace(editor,this.getAttribute("d"));		//替换插入选择的代码
               divPROMPT.innerHTML=""; 					//删除提示窗口
               divIV.innerHTML="";
               bInserted=true;						//防止选择后依旧出现选择
               editor.focus();						//继续获取焦点
            };
            d.onmouseover=function()
            {
               this.style.background="red";
               var c=divIV;
               c.innerText=this.getAttribute("d");
               c.style.left=this.parentElement.offsetWidth+this.offsetLeft+this.parentElement.offsetLeft-3+"px";
               c.style.top=this.offsetTop+this.parentElement.offsetTop+this.offsetHeight-19+"px";
               c.style.zIndex="999999999999";
               c.style.visibility="visible";
            };
            d.onmouseout=function()
            {
               this.style.background="white";
               divIV.style.visibility="hidden";
            };
            divPROMPT.appendChild(d);
            bFound=true;
         }
      }
   }
   else bInserted=false;

   if(!bFound)
   {
      divPROMPT.innerHTML=""; 
      divIV.innerHTML="";
   }
   else
   {
      divPROMPT.style.visibility="visible";

      if(bParent){
         var pixelPos = getCursorPixelPosition(editor);
         divPROMPT.style.left=pixelPos.x-310+"px";
         divPROMPT.style.top=(pixelPos.y-79)+"px";
         divPROMPT.style.zIndex=10000000000;
      }
      else
      {

         var pixelPos = getCursorPixelPosition(editor);
         divPROMPT.style.left=pixelPos.x+"px";
         divPROMPT.style.top=pixelPos.y+editor.renderer.lineHeight+"px";
         divPROMPT.style.zIndex=9;
      }
   }
}
